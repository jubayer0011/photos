<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrapbook Memories | Clean Edition</title>
    <style>
        :root {
            --bg-color: #f0f2f5; 
            --paper: #ffffff;
            --accent: #ff4757; 
            --text-main: #1e272e;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0,0,0,0.01) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,0,0,0.01) 1px, transparent 1px);
            background-size: 25px 25px;
            margin: 0;
            padding: 60px 20px;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--text-main);
        }

        .main-header {
            text-align: center;
            margin-bottom: 80px;
        }

        .main-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--text-main);
            border-bottom: 3px solid var(--accent);
            display: inline-block;
            padding-bottom: 10px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 50px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .polaroid {
            background: var(--paper);
            padding: 15px 15px 55px 15px; /* নিচের অংশ একটু বাড়ানো হয়েছে লেখার জন্য */
            box-shadow: 0 10px 25px rgba(0,0,0,0.07);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .polaroid:nth-child(odd) { transform: rotate(-1.5deg); }
        .polaroid:nth-child(even) { transform: rotate(1.5deg); }

        .polaroid:hover {
            transform: rotate(0deg) scale(1.05) translateY(-10px);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .polaroid img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            display: block;
        }

        /* কফি কালার মাস্কিং টেপ */
        .polaroid::before {
            content: '';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 30px;
            background: rgba(212, 163, 115, 0.25);
            backdrop-filter: blur(1px);
            border-left: 1px dashed rgba(0,0,0,0.1);
            border-right: 1px dashed rgba(0,0,0,0.1);
        }

        /* আপডেট করা বোল্ড ক্যাপশন */
        .caption {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 800; /* এক্সট্রা বোল্ড */
            color: #2f3542;
            text-transform: capitalize;
            letter-spacing: 0.5px;
            padding: 0 10px;
            box-sizing: border-box;
        }

        .polaroid:hover .caption {
            color: var(--accent);
        }

        footer {
            text-align: center;
            margin-top: 100px;
            font-size: 0.9rem;
            color: #a4b0be;
            font-weight: bold;
            letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .gallery-container { grid-template-columns: 1fr; }
            .polaroid { transform: rotate(0deg) !important; }
        }
    </style>
</head>
<body>

    <div class="main-header">
        <h1>Moments Archive</h1>
    </div>

    <div class="gallery-container">
        
        <div class="polaroid">
            <img src="memory1.jpg" alt="Tour">
            <p class="caption">Study Tour 2024</p>
        </div>

        <div class="polaroid">
            <img src="memory2.jpg" alt="Friends">
            <p class="caption">With Old School Friends</p>
        </div>

        <div class="polaroid">
            <img src="memory3.jpg" alt="High School">
            <p class="caption">Last Day Of School</p>
        </div>

        <div class="polaroid">
            <img src="memory4.jpg" alt="Eid">
            <p class="caption">Eid-Ul-Fitr 2025</p>
        </div>

        <div class="polaroid">
            <img src="memory5.jpg" alt="Break">
            <p class="caption">At The Playground</p>
        </div>

        <div class="polaroid">
            <img src="memory6.jpg" alt="Awesome">
            <p class="caption">Unforgettable Tour</p>
        </div>

        <div class="polaroid">
            <img src="memory7.jpg" alt="Result">
            <p class="caption">Result Day 2023</p>
        </div>

        <div class="polaroid">
            <img src="memory8.jpg" alt="Class Party">
            <p class="caption">Class Party 2019 🥹</p>
        </div>

    </div>

    <footer>
        before the memory fades...
    </footer>

</body>
</html>
